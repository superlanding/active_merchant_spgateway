name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.0", "3.1", "3.2", "3.3", "3.4"]
        rails: ["7.0", "7.1", "7.2", "8.0", "8.1"]
        exclude:
          # Rails 7.2 需要 Ruby >= 3.1
          - ruby: "3.0"
            rails: "7.2"
          # Rails 8.0 / 8.1 需要 Ruby >= 3.2
          - ruby: "3.0"
            rails: "8.0"
          - ruby: "3.0"
            rails: "8.1"
          - ruby: "3.1"
            rails: "8.0"
          - ruby: "3.1"
            rails: "8.1"
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake t
